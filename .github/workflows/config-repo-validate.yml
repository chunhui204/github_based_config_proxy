name: Validate Config JSON

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate all config files as JSON
        run: |
          set -e
          echo "Validating all config files as JSON..."

          ERROR_COUNT=0
          TOTAL_COUNT=0

          while IFS= read -r -d '' file; do
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            echo "Checking: $file"
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"; then
              echo "ERROR: Invalid JSON in $file"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < <(find . -type f \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -name "README*" \
            -not -name "LICENSE*" \
            -not -name ".gitignore" \
            -print0)

          echo ""
          echo "Total files checked: $TOTAL_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "FAILED: $ERROR_COUNT invalid JSON file(s)"
            exit 1
          fi
          echo "All $TOTAL_COUNT files are valid JSON."
